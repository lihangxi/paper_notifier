[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-notifier"
version = "2.0.0"
description = "Slack bot for daily paper summaries"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "apscheduler==3.10.4",
    "feedparser==6.0.11",
    "openai==1.68.2",
    "python-dotenv==1.0.1",
    "requests==2.32.3",
]

[project.optional-dependencies]
# Knowledge-base relevance against a Zotero library (local open-source models).
# Install with: pip install -e ".[kb]"
kb = [
    "numpy>=1.24.0",
    "sentence-transformers>=2.7.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
